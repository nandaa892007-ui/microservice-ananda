services:
  # ==========================================
  # 1. Product Service & MySQL Database (Port: 3000)
  # ==========================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy

  product-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=productdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3306:3306"
    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  # ==========================================
  # 2. Cart Service & PostgreSQL Database (Port: 3001)
  # ==========================================
  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=cart-db
      - DB_PORT=5432
      - DB_DATABASE=cartdb
      - DB_USERNAME=appuser
      - DB_PASSWORD=apppassword
      - LOG_CHANNEL=stderr
      - PRODUCT_SERVICE_URL=http://product-service:3000
    depends_on:
      cart-db:
        condition: service_healthy

  cart-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=cartdb
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppassword
    ports:
      - "5432:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cartdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  # ==========================================
  # 3. Review Service & MongoDB Database (Port: 3002)
  # ==========================================
  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - FLASK_DEBUG=1
      - MONGO_URI=mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      - MONGO_DB_NAME=reviewdb
      - PRODUCT_SERVICE_URL=http://product-service:3000
    depends_on:
      review-db:
        condition: service_healthy
      product-service:
        condition: service_started

  review-db:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=appuser
      - MONGO_INITDB_ROOT_PASSWORD=apppassword
    ports:
      - "27017:27017"
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  # ==========================================
  # 4. Order Service & MySQL Database (Port: 3003) - UTS
  # ==========================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - APP_NAME=order-service
      - APP_ENV=local
      - APP_KEY=base64:3f0wYm3gXn8V0eF4N6z5g1u7P8j9k0l1m2n3o4p5q6r=
      - APP_DEBUG=true
      - APP_URL=http://localhost:3003
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=mysql
      - DB_HOST=order-db
      - DB_PORT=3306
      - DB_DATABASE=orderdb
      - DB_USERNAME=appuser
      - DB_PASSWORD=apppassword
      - PRODUCT_SERVICE_URL=http://product-service:3000
      - CART_SERVICE_URL=http://cart-service:3001
      - SERVICE_TIMEOUT=5
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
      cart-service:
        condition: service_started

  order-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=orderdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3307:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  product-db-data:
  cart-db-data:
  review-db-data:
  order-db-data:
